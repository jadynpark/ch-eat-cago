<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ch-eat-cago · JP's Chicago restaurant list</title>
<meta name="description" content="JP's opinionated guide to eating in Chicago.">
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<style>
  :root{ --bg:#faf7f2; --panel:#fff; --ink:#1f1d1a; --muted:#6f6a62; --line:#e7e1d7; --accent:#c8442f; --soft:#fbf6ee; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
  .app{display:grid;grid-template-columns:420px 1fr;height:100vh}
  aside{display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel);min-height:0}
  header{padding:18px 20px 10px}
  h1{margin:0;font-size:28px;letter-spacing:-.02em;font-family:Georgia,"Times New Roman",serif}
  h1 span{color:var(--accent)}
  .sub{margin:4px 0 0;color:var(--muted);font-size:13px}
  .filters{padding:0 20px 12px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  input[type=search],input[type=text],select,textarea{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-width:0}
  input[type=search]{width:100%}
  select{flex:1}
  .tabs{display:flex;background:#f1ece4;border-radius:10px;padding:3px;gap:2px}
  .tab{flex:1;font:inherit;font-size:13px;padding:6px 4px;border:0;border-radius:8px;background:none;cursor:pointer;color:var(--muted);white-space:nowrap}
  .tab[aria-selected=true]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .tab .n{opacity:.55;font-weight:400}
  .chip{font:inherit;font-size:13px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;color:var(--ink);user-select:none}
  .chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip.cat{display:inline-flex;align-items:center;gap:3px}
  .chip.cat .emo{font-size:15px;line-height:1;margin-right:2px}
  .chip.cat[aria-pressed=true]{background:color-mix(in srgb, var(--c) 16%, #fff);color:var(--ink);border-color:var(--c)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:0;flex:none}
  .dot.want{background:#fff;box-shadow:inset 0 0 0 2px var(--c)}
  .meta-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
  .link{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;font-size:13px;padding:0}
  .list{overflow-y:auto;flex:1;padding:8px 12px 24px}
  .card{padding:12px;border-radius:10px;border:1px solid transparent;cursor:pointer;margin-bottom:2px}
  .card:hover,.card.active{background:var(--soft);border-color:var(--line)}
  .card.static{cursor:default}
  .card h3{margin:0;font-size:16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .info{font-size:12.5px;color:var(--muted);margin:3px 0 6px}
  .card ul.notes{margin:0 0 8px;padding-left:18px;font-size:13.5px;line-height:1.45}
  .badge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap}
  .b-fave{background:#fdecc8;color:#8a5a00}
  .b-skip{background:#f6dcdc;color:#9b2c2c}
  .b-want{background:#e1ecfb;color:#24589b}
  .b-closed,.b-maybe-closed{background:#eee;color:#666}
  .empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}
  /* reserve */
  .res{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .btn{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:12.5px;font-weight:600;text-decoration:none;padding:5px 11px;border-radius:8px;background:var(--ink);color:#fff;border:1px solid var(--ink);white-space:nowrap;cursor:pointer}
  .btn:hover{background:#000}
  .btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
  .btn.ghost:hover{border-color:var(--ink)}
  .rnote{font-size:12px;color:var(--muted)}
  /* stars */
  .ratings{display:grid;grid-template-columns:auto auto;gap:1px 14px;font-size:12px;color:var(--muted);margin:2px 0 8px;width:max-content}
  .ratings .r{display:flex;align-items:center;gap:6px}
  .ratings .lbl{width:52px}
  .stars{position:relative;display:inline-block;font-size:13px;line-height:1;letter-spacing:1px;color:#ddd5c8}
  .stars::before{content:"★★★★★"}
  .stars i{position:absolute;inset:0 auto 0 0;overflow:hidden;white-space:nowrap;color:#e0a526;font-style:normal}
  .stars i::before{content:"★★★★★"}
  .overall{font-size:12px;font-weight:600;color:#8a5a00;white-space:nowrap;margin-left:auto}
  /* friend comments */
  .fc{border-top:1px dashed var(--line);margin-top:6px;padding-top:6px;font-size:13px}
  .fc-h{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
  .fc-item{background:#f6f2ec;border-radius:8px;padding:6px 9px;margin-bottom:5px;line-height:1.4}
  .fc-item b{font-weight:600}
  .fc-item .when{color:var(--muted);font-size:11px;margin-left:4px}
  .cform{display:grid;gap:6px;margin-top:6px}
  .cform textarea{min-height:64px;resize:vertical}
  .cform .actions{display:flex;align-items:center;gap:8px}
  .cmsg{font-size:12px;color:var(--muted)}
  .hp{position:absolute!important;left:-9999px!important;width:1px;height:1px;opacity:0}
  .suggest{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
  .suggest h3{margin:0 0 2px;font-size:15px}
  /* map */
  main{position:relative;min-height:0}
  #map{position:absolute;inset:0;background:#f2efe9}
  .nomap{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:14px;padding:20px;text-align:center}
  .pin-wrap{cursor:pointer}
  .pin{width:16px;height:16px;border-radius:50%;background:var(--c);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform .12s ease}
  .pin.fave{width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;line-height:1}
  .pin.want{background:#fff;border:3px solid var(--c)}
  .pin.closed{opacity:.45;filter:grayscale(1)}
  .pin.hl,.pin-wrap:hover .pin{transform:scale(1.45)}
  .maplibregl-popup{z-index:100}                       /* hover info always above every pin */
  .maplibregl-popup.tip .maplibregl-popup-content{padding:12px 14px;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.22);font-family:inherit;max-height:60vh;overflow:auto}
  .tip h4{margin:0 0 2px;font-size:15px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .tip .info{font-size:12px;margin-bottom:6px}
  .tip ul.notes{margin:0 0 8px;padding-left:16px;font-size:13px;line-height:1.4}
  .tip .fc-item{font-size:12.5px}
  .legend{position:absolute;right:10px;bottom:28px;background:rgba(255,255,255,.95);padding:8px 10px;border-radius:8px;font-size:12px;box-shadow:0 1px 6px rgba(0,0,0,.15);line-height:1.7;z-index:2;pointer-events:none}
  @media (max-width:800px){
    .app{grid-template-columns:1fr;grid-template-rows:44vh 1fr;height:100dvh}
    main{order:-1}
    aside{border-right:0;border-top:1px solid var(--line)}
    header{padding:14px 16px 8px} h1{font-size:22px}
    .filters{padding:0 16px 10px}
    .legend{display:none}
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <h1>Ch-<span>eat</span>-cago</h1>
      <p class="sub">JP's very honest Chicago restaurant list. Hover a pin to read my take.</p>
    </header>
    <div class="filters">
      <div class="tabs" role="tablist" id="tabs">
        <button class="tab" role="tab" data-view="all" aria-selected="true">All <span class="n" id="n-all"></span></button>
        <button class="tab" role="tab" data-view="been" aria-selected="false">Been <span class="n" id="n-been"></span></button>
        <button class="tab" role="tab" data-view="want" aria-selected="false">Want to go <span class="n" id="n-want"></span></button>
        <button class="tab" role="tab" data-view="friends" aria-selected="false" id="tab-friends" hidden>💬 Friends <span class="n" id="n-friends"></span></button>
      </div>
      <div id="filterControls" style="display:grid;gap:8px">
        <input type="search" id="q" placeholder="Search names, dishes, comments…">
        <div class="row" id="cats"></div>
        <div class="row"><select id="hood" aria-label="Neighborhood"></select></div>
        <div class="row" id="prices"></div>
        <div class="row">
          <button class="chip" id="faves" aria-pressed="false">★ Faves only</button>
          <button class="chip" id="hideClosed" aria-pressed="true">Hide closed</button>
          <select id="sort" aria-label="Sort" style="flex:1">
            <option value="name">Sort: A–Z</option>
            <option value="r_overall">Sort: ★ Overall</option>
            <option value="r_food">Sort: ★ Food</option>
            <option value="r_value">Sort: ★ Value</option>
            <option value="r_vibe">Sort: ★ Vibe</option>
            <option value="r_service">Sort: ★ Service</option>
            <option value="visited">Sort: Recently visited</option>
            <option value="cuisine">Sort: Cuisine</option>
            <option value="neighborhood">Sort: Neighborhood</option>
            <option value="priceAsc">Sort: Price ↑</option>
            <option value="priceDesc">Sort: Price ↓</option>
          </select>
        </div>
      </div>
      <div class="meta-row"><span id="count"></span><button class="link" id="reset">Reset filters</button></div>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <main><div id="map"></div><div class="legend" id="legend"></div></main>
</div>

<!-- load data fresh every visit so edits show up right away -->
<script>document.write('<script src="config.js?v=' + Date.now() + '"><\/script><script src="restaurants.js?v=' + Date.now() + '"><\/script>');</script>
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script>
(function(){
  // ================= config =================
  const API = (typeof SHEET_API === "string" && SHEET_API.trim()) || "";
  const COMMENTS_ON = false;   // friend comments are off (JP-only editing via the Google Sheet)
  const CATEGORIES = [
    ["American",                   "#c8442f", "🍔"],
    ["Italian & European",         "#3a6bb0", "🍝"],
    ["Mediterranean & Latin",      "#de8a12", "🧆"],
    ["Japanese",                   "#2f7d6d", "🍣"],
    ["Chinese, Korean & SE Asian", "#7f9a22", "🥟"],
    ["Dessert & Bars",             "#a14d8c", "🍨"],
  ];
  const COLOR = Object.fromEntries(CATEGORIES.map(([c,h]) => [c,h]));
  const CAT_ORDER = Object.fromEntries(CATEGORIES.map(([c],i) => [c,i]));
  const MAP_STYLE = "https://tiles.openfreemap.org/styles/liberty";
  const RES_LABEL = {OpenTable:"Reserve on OpenTable", Resy:"Reserve on Resy", Tock:"Book on Tock",
    SevenRooms:"Reserve (SevenRooms)", Website:"Reserve on website", Phone:"Website", "Walk-in":"Website"};
  const RATING_CATS = [["food","Food"],["value","Value"],["vibe","Vibe"],["service","Service"]];
  const CACHE_KEY = "cheatcago-live-v1";

  // ================= helpers =================
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const $$ = n => n ? "$".repeat(n) : "";
  const key = s => String(s || "").trim().toLowerCase();
  const colorOf = r => COLOR[r.category] || "#888";
  const store = {
    get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
    set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  };
  const MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
  function visitKey(s){                       // "Oct 2024" / "2024-10" / "2024" → sortable number
    s = String(s || "").toLowerCase(); const y = s.match(/(19|20)\d\d/); if (!y) return null;
    let m = MONTHS.findIndex(x => s.includes(x)); if (m < 0){ const mm = s.match(/(?:^|\D)(\d{1,2})(?:\D|$)/); m = mm && +mm[1] >= 1 && +mm[1] <= 12 ? +mm[1]-1 : 0; }
    return +y[0]*12 + m;
  }
  function timeAgo(iso){
    const d = new Date(iso); if (isNaN(d)) return "";
    const days = Math.floor((Date.now() - d) / 864e5);
    if (days < 1) return "today"; if (days < 2) return "yesterday"; if (days < 30) return days + "d ago";
    return d.toLocaleDateString(undefined, {month:"short", year:"numeric"});
  }

  // ================= data =================
  let data = [], byId = {}, comments = [], commentsBy = {};
  function normalize(list){
    return (list || []).map((r,i) => {
      const tags = r.tags || [];                               // support older restaurants.js format
      const status = r.status || (tags.includes("closed") ? "closed" : tags.includes("maybe-closed") ? "maybe-closed" : tags.includes("wishlist") ? "want" : "been");
      const tag = r.tag !== undefined ? r.tag : (tags.includes("fave") ? "fave" : tags.includes("skip") ? "skip" : "");
      const ratings = r.ratings || null;
      const vals = ratings ? RATING_CATS.map(([k]) => ratings[k]).filter(x => typeof x === "number") : [];
      return {
        ...r, id:i, status, tag,
        type: r.type || r.cuisine || "", category: r.category || "",
        notes: r.notes || [], ratings: vals.length ? ratings : null,
        overall: vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10)/10 : null,
        isClosed: status === "closed", isFave: tag === "fave", isWant: status === "want",
        hasPin: typeof r.lat === "number" && typeof r.lng === "number",
        visit: visitKey(r.lastVisited),
      };
    });
  }
  function setData(list, cmts){
    data = normalize(list);
    byId = Object.fromEntries(data.map(r => [r.id, r]));
    comments = (cmts || []).filter(c => c && c.comment);
    commentsBy = {};
    comments.forEach(c => (commentsBy[key(c.restaurant)] ||= []).push(c));
    Object.values(commentsBy).forEach(a => a.sort((x,y) => String(x.date).localeCompare(String(y.date))));
    refreshControls(); buildMarkers(); render(false);
  }
  const commentsFor = r => commentsBy[key(r.name)] || [];
  function friendPicks(){                       // comments about places not on JP's list
    const known = new Set(data.map(r => key(r.name)));
    const groups = {};
    comments.forEach(c => { const k = key(c.restaurant); if (!known.has(k)) (groups[k] ||= {name:c.restaurant.trim(), items:[]}).items.push(c); });
    return Object.values(groups).sort((a,b) => String(b.items.at(-1).date).localeCompare(String(a.items.at(-1).date)));
  }

  // ================= HTML bits =================
  const stars = v => `<span class="stars" role="img" aria-label="${v} out of 5"><i style="width:${v/5*100}%"></i></span>`;
  const ratingsHtml = r => !r.ratings ? "" :
    `<div class="ratings">${RATING_CATS.filter(([k]) => typeof r.ratings[k] === "number")
      .map(([k,l]) => `<span class="r"><span class="lbl">${l}</span>${stars(r.ratings[k])}</span>`).join("")}</div>`;
  const overallHtml = r => r.overall == null ? "" : `<span class="overall">★ ${r.overall.toFixed(1)}</span>`;
  const infoLine = r => [esc(r.type), esc(r.neighborhood), $$(r.price),
    r.isWant ? "Haven't been yet" : (r.lastVisited ? `Visited ${esc(r.lastVisited)}` : "")].filter(Boolean).join(" · ");
  const BADGE = {fave:"★ Fave", skip:"Skip"};
  const STATUS_BADGE = {want:"Want to go", closed:"Closed", "maybe-closed":"May be closed"};
  const badges = r => [STATUS_BADGE[r.status] ? `<span class="badge b-${r.status}">${STATUS_BADGE[r.status]}</span>` : "",
    BADGE[r.tag] ? `<span class="badge b-${r.tag}">${BADGE[r.tag]}</span>` : ""].join(" ");
  const notesHtml = r => r.notes.length ? `<ul class="notes">${r.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : "";
  const reserveHtml = r => {
    const x = r.reserve; if (!x || !x.url || r.isClosed) return "";
    const ghost = x.via === "Walk-in" || x.via === "Phone";
    const note = x.note || (x.via === "Walk-in" ? "Walk-in only" : "");
    return `<div class="res"><a class="btn${ghost?" ghost":""}" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(RES_LABEL[x.via] || "Website")} ↗</a>${note?`<span class="rnote">${esc(note)}</span>`:""}</div>`;
  };
  const commentItem = c => `<div class="fc-item"><b>${esc(c.name || "Anonymous")}</b><span class="when">${esc(timeAgo(c.date))}</span><br>${esc(c.comment)}</div>`;
  const formHtml = (restaurant, isNew) => `
    <form class="cform" ${isNew ? "" : "hidden"} data-restaurant="${esc(restaurant || "")}">
      ${isNew ? `<input type="text" name="restaurant" placeholder="Restaurant name" maxlength="100" required>` : ""}
      <input type="text" name="name" placeholder="Your name" maxlength="40" value="${esc(store.get("cheatcago-name") || "")}">
      <textarea name="comment" placeholder="${isNew ? "Why should JP go? What to order?" : "Agree? Disagree? What to order?"}" maxlength="1000" required></textarea>
      <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="actions"><button class="btn" type="submit">Post</button><span class="cmsg"></span></div>
    </form>`;
  const friendsHtml = r => {
    if (!API || !COMMENTS_ON) return "";
    const list = commentsFor(r);
    return `<div class="fc">${list.length ? `<div class="fc-h">💬 Friends say (${list.length})</div>${list.map(commentItem).join("")}` : ""}
      <button class="link add-c" type="button">＋ ${list.length ? "Add yours" : "Leave a comment"}</button>${formHtml(r.name, false)}</div>`;
  };
  const tipHtml = r => {
    const fc = COMMENTS_ON ? commentsFor(r) : [];
    return `<h4>${esc(r.name)} ${badges(r)}</h4>
      <div class="info">${infoLine(r)}${r.overall!=null?` · ★ ${r.overall.toFixed(1)}`:""}<br>${esc(r.address || "")}</div>
      ${ratingsHtml(r)}${notesHtml(r)}${reserveHtml(r)}
      ${fc.length ? `<div class="fc"><div class="fc-h">💬 Friends say (${fc.length})</div>${fc.slice(-2).map(commentItem).join("")}${fc.length>2?`<div class="cmsg">+${fc.length-2} more in the list</div>`:""}</div>` : ""}`;
  };

  // ================= state & controls =================
  const state = {view:"all", q:"", cats:new Set(), hood:"", prices:new Set(), faves:false, hideClosed:true, sort:"name"};
  const toggle = (set, v) => set.has(v) ? set.delete(v) : set.add(v);
  const catBtns = {};
  CATEGORIES.forEach(([c, hex, emo]) => {
    const b = document.createElement("button");
    b.className = "chip cat"; b.style.setProperty("--c", hex); b.setAttribute("aria-pressed","false");
    b.innerHTML = `<span class="emo">${emo}</span>${esc(c)} <span class="cnt" style="opacity:.6"></span>`;
    b.onclick = () => { toggle(state.cats, c); b.setAttribute("aria-pressed", state.cats.has(c)); render(true); };
    $("cats").appendChild(b); catBtns[c] = b;
  });
  [1,2,3,4].forEach(p => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = $$(p); b.setAttribute("aria-pressed","false");
    b.onclick = () => { toggle(state.prices, p); b.setAttribute("aria-pressed", state.prices.has(p)); render(true); };
    $("prices").appendChild(b);
  });
  $("legend").innerHTML = CATEGORIES.map(([c,hex,emo]) => `<div><span class="dot" style="--c:${hex}"></span>${emo} ${esc(c)}</div>`).join("") +
    `<div style="margin-top:2px;color:#6f6a62">★ = JP favorite · ◯ = want to go</div>`;
  if (API && COMMENTS_ON) $("tab-friends").hidden = false;

  function refreshControls(){
    CATEGORIES.forEach(([c]) => { catBtns[c].querySelector(".cnt").textContent = data.filter(r => r.category === c).length; });
    const counts = {}; data.forEach(r => { if (r.neighborhood) counts[r.neighborhood] = (counts[r.neighborhood]||0)+1; });
    if (state.hood && !counts[state.hood]) state.hood = "";
    $("hood").innerHTML = `<option value="">All neighborhoods</option>` +
      Object.keys(counts).sort().map(v => `<option value="${esc(v)}">${esc(v)} (${counts[v]})</option>`).join("");
    $("hood").value = state.hood;
    $("n-all").textContent = data.length;
    $("n-been").textContent = data.filter(r => r.status === "been").length;
    $("n-want").textContent = data.filter(r => r.isWant).length;
    $("n-friends").textContent = comments.length || "";
  }

  document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
    state.view = t.dataset.view;
    document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === t));
    $("filterControls").style.display = state.view === "friends" ? "none" : "grid";
    $("reset").style.visibility = state.view === "friends" ? "hidden" : "visible";
    closePopup(); render(true);
  });
  $("q").oninput = e => { state.q = e.target.value.trim().toLowerCase(); render(true); };
  $("hood").onchange = e => { state.hood = e.target.value; render(true); };
  $("sort").onchange = e => { state.sort = e.target.value; render(false); };
  $("faves").onclick = e => { state.faves = !state.faves; e.currentTarget.setAttribute("aria-pressed", state.faves); render(true); };
  $("hideClosed").onclick = e => { state.hideClosed = !state.hideClosed; e.currentTarget.setAttribute("aria-pressed", state.hideClosed); render(false); };
  $("reset").onclick = () => {
    Object.assign(state, {q:"", hood:"", faves:false, hideClosed:true, sort:"name"});
    state.cats.clear(); state.prices.clear();
    $("q").value=""; $("hood").value=""; $("sort").value="name";
    document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed","false"));
    $("hideClosed").setAttribute("aria-pressed","true");
    render(false); resetView();
  };

  // ================= filter & sort =================
  function matches(r){
    if (state.view === "been" && r.status !== "been") return false;
    if (state.view === "want" && !r.isWant) return false;
    if (state.cats.size && !state.cats.has(r.category)) return false;
    if (state.hood && r.neighborhood !== state.hood) return false;
    if (state.prices.size && !state.prices.has(r.price)) return false;
    if (state.faves && !r.isFave) return false;
    if (state.hideClosed && r.isClosed) return false;
    if (state.q){
      const hay = [r.name, r.category, r.type, r.neighborhood, r.address, ...r.notes, ...commentsFor(r).map(c => c.comment)].join(" ").toLowerCase();
      if (!hay.includes(state.q)) return false;
    }
    return true;
  }
  const byName = (a,b) => a.name.localeCompare(b.name);
  const nl = (x, y, cmp) => x == null && y == null ? 0 : x == null ? 1 : y == null ? -1 : cmp();
  const SORTS = {
    name: byName,
    cuisine: (a,b) => (CAT_ORDER[a.category] ?? 99)-(CAT_ORDER[b.category] ?? 99) || a.type.localeCompare(b.type) || byName(a,b),
    neighborhood: (a,b) => a.neighborhood.localeCompare(b.neighborhood) || byName(a,b),
    priceAsc: (a,b) => (a.price||9)-(b.price||9) || byName(a,b),
    priceDesc: (a,b) => (b.price||0)-(a.price||0) || byName(a,b),
    visited: (a,b) => nl(a.visit, b.visit, () => b.visit - a.visit) || byName(a,b),
  };
  ["overall","food","value","vibe","service"].forEach(k => {
    const get = r => k === "overall" ? r.overall : (r.ratings && typeof r.ratings[k] === "number" ? r.ratings[k] : null);
    SORTS["r_"+k] = (a,b) => { const x = get(a), y = get(b); return nl(x, y, () => y - x || (b.overall||0) - (a.overall||0)) || byName(a,b); };
  });

  // ================= map =================
  const HOME = {center:[-87.648, 41.905], zoom:11.4};
  let map = null, popup = null, hideTimer = null, pinnedId = null, markers = {};
  if (window.maplibregl){
    map = new maplibregl.Map({container:"map", style:MAP_STYLE, ...HOME, attributionControl:{compact:true}, dragRotate:false, pitchWithRotate:false});
    map.addControl(new maplibregl.NavigationControl({showCompass:false}), "top-left");
    map.touchZoomRotate.disableRotation();
    popup = new maplibregl.Popup({closeButton:false, closeOnClick:false, offset:16, maxWidth:"330px", className:"tip", focusAfterOpen:false});
    map.on("click", () => { pinnedId = null; popup.remove(); });
  } else {
    $("map").innerHTML = '<div class="nomap">Map couldn\'t load (offline?). The list still works.</div>';
  }
  function buildMarkers(){
    if (!map) return;
    Object.values(markers).forEach(m => m.remove()); markers = {}; closePopup();
    data.filter(r => r.hasPin).forEach(r => {
      const el = document.createElement("div");
      el.className = "pin-wrap";
      el.innerHTML = `<div class="pin${r.isFave?" fave":""}${r.isWant?" want":""}${r.isClosed?" closed":""}" style="--c:${colorOf(r)}">${r.isFave?"★":""}</div>`;
      el.style.zIndex = r.isFave ? 2 : 1;
      el.addEventListener("mouseenter", () => { pinnedId = null; showPopup(r.id); setActive(r.id, true); });
      el.addEventListener("mouseleave", () => { setActive(r.id, false); scheduleHide(); });
      el.addEventListener("click", e => {
        e.stopPropagation(); pinnedId = r.id; showPopup(r.id);
        const c = document.querySelector(`.card[data-id="${r.id}"]`);
        if (c){ c.scrollIntoView({behavior:"smooth", block:"center"}); flash(c); }
      });
      markers[r.id] = new maplibregl.Marker({element:el}).setLngLat([r.lng, r.lat]).addTo(map);
    });
  }
  function showPopup(id){
    const r = byId[id]; if (!map || !r || !r.hasPin) return;
    clearTimeout(hideTimer);
    popup.setLngLat([r.lng, r.lat]).setHTML(tipHtml(r)).addTo(map);
    const el = popup.getElement();
    el.onmouseenter = () => clearTimeout(hideTimer);
    el.onmouseleave = scheduleHide;
  }
  function scheduleHide(){
    if (!map || pinnedId != null) return;
    clearTimeout(hideTimer); hideTimer = setTimeout(() => popup.remove(), 220);
  }
  function closePopup(){ if (popup){ pinnedId = null; popup.remove(); } }
  function setActive(id, on){
    const c = document.querySelector(`.card[data-id="${id}"]`); if (c) c.classList.toggle("active", on);
    const m = markers[id]; if (!m) return;
    const el = m.getElement(); el.firstChild.classList.toggle("hl", on);
    el.style.zIndex = on ? 10 : (byId[id].isFave ? 2 : 1);
  }
  function flash(c){ c.classList.add("active"); setTimeout(() => c.classList.remove("active"), 1200); }
  function resetView(){ if (map) map.flyTo({...HOME, duration:600}); }

  // ================= render =================
  function render(refit){
    if (state.view === "friends") return renderFriends();
    const shown = data.filter(matches).sort(SORTS[state.sort]);
    const ids = new Set(shown.map(r => r.id));
    $("count").textContent = `${shown.length} of ${data.length} spots`;
    $("list").innerHTML = shown.length ? shown.map(r => `
      <div class="card" data-id="${r.id}">
        <h3><span class="dot${r.isWant?" want":""}" style="--c:${colorOf(r)}"></span>${esc(r.name)} ${badges(r)}${overallHtml(r)}</h3>
        <div class="info">${infoLine(r)}</div>
        ${ratingsHtml(r)}${notesHtml(r)}${reserveHtml(r)}${friendsHtml(r)}
      </div>`).join("") : `<div class="empty">Nothing matches. Try loosening a filter.</div>`;

    if (map){
      Object.entries(markers).forEach(([id, m]) => { m.getElement().style.display = ids.has(+id) ? "" : "none"; });
      if (pinnedId != null && !ids.has(pinnedId)) closePopup();
      const pins = shown.filter(r => r.hasPin);
      if (refit && pins.length && (anyFilter() || state.view !== "all")){
        const b = new maplibregl.LngLatBounds(); pins.forEach(r => b.extend([r.lng, r.lat]));
        map.fitBounds(b, {padding:70, maxZoom:15, duration:600});
      } else if (refit) resetView();
    }
  }
  function renderFriends(){
    const picks = friendPicks();
    $("count").textContent = `${comments.length} comment${comments.length===1?"":"s"} from friends`;
    if (map) Object.values(markers).forEach(m => m.getElement().style.display = "none");
    const recent = comments.filter(c => data.some(r => key(r.name) === key(c.restaurant))).slice(-5).reverse();
    $("list").innerHTML = `
      <div class="suggest"><h3>Suggest a spot for JP</h3><div class="info">Know a place that should be on here? Tell me!</div>${formHtml("", true)}</div>
      ${picks.length ? `<div class="fc-h" style="margin:12px 4px 6px">Places friends recommend</div>` : ""}
      ${picks.map(g => `<div class="card static"><h3>${esc(g.name)}</h3>${g.items.map(commentItem).join("")}</div>`).join("")}
      ${recent.length ? `<div class="fc-h" style="margin:14px 4px 6px">Latest comments on JP's list</div>` +
        recent.map(c => `<div class="card static"><h3 style="font-size:14px">${esc(c.restaurant)}</h3>${commentItem(c)}</div>`).join("") : ""}
      ${!picks.length && !recent.length ? `<div class="empty">No comments yet. Be the first!</div>` : ""}`;
  }
  const anyFilter = () => state.q || state.cats.size || state.hood || state.prices.size || state.faves;

  // list interactions (event delegation)
  const list = $("list");
  list.addEventListener("mouseover", e => {
    const c = e.target.closest(".card[data-id]"); if (!c || c.contains(e.relatedTarget)) return;
    const id = +c.dataset.id; setActive(id, true); pinnedId = null; showPopup(id);
  });
  list.addEventListener("mouseout", e => {
    const c = e.target.closest(".card[data-id]"); if (!c || c.contains(e.relatedTarget)) return;
    setActive(+c.dataset.id, false); scheduleHide();
  });
  list.addEventListener("click", e => {
    const add = e.target.closest(".add-c");
    if (add){ const f = add.nextElementSibling; f.hidden = !f.hidden; if (!f.hidden) f.querySelector("textarea").focus(); return; }
    if (e.target.closest("a, form, .fc")) return;
    const c = e.target.closest(".card[data-id]"); if (!c || !map) return;
    const r = byId[+c.dataset.id]; if (!r || !r.hasPin) return;
    pinnedId = r.id; showPopup(r.id);
    map.flyTo({center:[r.lng, r.lat], zoom:Math.max(map.getZoom(), 14.5), duration:600});
  });
  list.addEventListener("submit", async e => {
    e.preventDefault();
    const f = e.target, msg = f.querySelector(".cmsg"), btn = f.querySelector("button[type=submit]");
    const payload = {
      restaurant: (f.elements.restaurant ? f.elements.restaurant.value : f.dataset.restaurant).trim(),
      name: f.elements.name.value.trim(), comment: f.elements.comment.value.trim(), website: f.elements.website.value
    };
    if (!payload.restaurant || !payload.comment) { msg.textContent = "Please fill this in first."; return; }
    store.set("cheatcago-name", payload.name);
    btn.disabled = true; msg.textContent = "Posting…";
    try {
      const res = await fetch(API, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload)});
      const out = await res.json();
      if (!out.ok) throw new Error(out.error || "Something went wrong");
      comments.push({restaurant:payload.restaurant, name:payload.name || "Anonymous", comment:payload.comment, date:new Date().toISOString()});
      setData(dataRaw, comments);                 // show it right away
      loadLive();                                 // and sync with the sheet
    } catch (err) {
      msg.textContent = "Couldn't post: " + err.message; btn.disabled = false;
    }
  });

  // ================= load =================
  let dataRaw = window.RESTAURANTS || [];
  async function loadLive(){
    if (!API) return;
    try {
      const res = await fetch(API + (API.includes("?") ? "&" : "?") + "t=" + Date.now());
      const live = await res.json();
      if (!Array.isArray(live.restaurants) || !live.restaurants.length) throw new Error("empty");
      store.set(CACHE_KEY, live);
      dataRaw = live.restaurants;
      setData(live.restaurants, COMMENTS_ON ? (live.comments || []) : []);
    } catch (err) { console.warn("Live data unavailable, using saved copy.", err); }
  }
  const cached = API ? store.get(CACHE_KEY) : null;
  if (cached && Array.isArray(cached.restaurants) && cached.restaurants.length){
    dataRaw = cached.restaurants; setData(cached.restaurants, COMMENTS_ON ? (cached.comments || []) : []);
  } else setData(dataRaw, []);
  loadLive();
})();
</script>
</body>
